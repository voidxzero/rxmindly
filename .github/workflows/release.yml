# Builds the Android app and publishes it as a GitHub release whenever a
# version tag (v1.2.0) is pushed. The app on the phone looks at these releases
# to update itself. Use ./release.sh to bump the version and push the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches the app version
        run: |
          version="$(node -p "require('./web/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match web/package.json version $version" >&2
            exit 1
          fi

      - name: Test
        run: |
          (cd server && npm test)
          (cd web && npm ci && npm test)

      # Every release must be signed with the same key, or phones refuse it as an update.
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "The KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets are not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=rxmindly\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "RXMINDLY_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Build the APK
        run: ./build-apk.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rxmindly.apk --title "Rxmindly ${GITHUB_REF_NAME#v}" --generate-notes
